[package]
name = "ltk-anvil"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[lib]
name = "ltk_anvil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ltk_io_ext = "0.4.10"
ltk_mesh = "0.5.6"
ltk_anim = "0.3.15"
ltk_mapgeo = "0.3.6"
ltk_shader = "0.3.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
